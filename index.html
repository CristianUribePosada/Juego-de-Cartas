<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Juego de Cartas - Micromundos ITM</title>
    <style>
      @import url("https://fonts.googleapis.com/css?family=Poppins:100,200,300,400,500,600,700,800&display=swap");

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Poppins", sans-serif;
      }

      body {
        background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQN9BIQWtMgrlV9pWMzLweIDtEfBzL-WY9jeuhW6rxbAg&s=10");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }

      /* Tablero de 5 columnas x 4 filas */
      .grid-container {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        grid-template-rows: repeat(4, 1fr);
        gap: 15px;
        max-width: 900px;
        width: 100%;
      }

      /* Estilos de las cartas */
      .card-btn {
        background-color: #ffffff;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        height: 120px;
        font-size: 1.8rem;
        font-weight: bold;
        color: #333333;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        transition:
          transform 0.2s ease,
          background-color 0.2s ease,
          box-shadow 0.2s ease;
      }

      /* Hover para elevar la carta */
      .card-btn:hover:not(:disabled) {
        transform: translateY(-8px) !important;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        border-color: #cccccc;
      }

      /* Estado deshabilitado (gris) */
      .card-btn:disabled {
        background-color: #d1d5db;
        color: #6b7280;
        border-color: #9ca3af;
        cursor: not-allowed;
        box-shadow: none;
      }

      /* Estilos base del Modal con transiciones habilitadas */
      .modal {
        border: none;
        border-radius: 16px;
        padding: 16px;
        width: 92vw;
        height: 92vh;
        max-width: none;
        max-height: none;
        margin: auto;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        background-color: #ffffff;
        position: relative;
        overflow: hidden;

        opacity: 0;
        transform: scale(0.8);
        transition:
          opacity 0.3s ease-out,
          transform 0.3s ease-out,
          overlay 0.3s allow-discrete,
          display 0.3s allow-discrete;
      }

      .modal[open] {
        opacity: 1;
        transform: scale(1);
      }

      @starting-style {
        .modal[open] {
          opacity: 0;
          transform: scale(0.8);
        }
      }

      .modal::backdrop {
        background-color: rgba(0, 0, 0, 0.7);
        transition:
          background-color 0.3s ease-out,
          overlay 0.3s allow-discrete,
          display 0.3s allow-discrete;
      }

      @starting-style {
        .modal[open]::backdrop {
          background-color: rgba(0, 0, 0, 0);
        }
      }

      .modal-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        text-align: center;
        height: 100%;
        width: 100%;
      }

      .modal-question {
        font-size: 1.4rem;
        color: #1f2937;
        font-weight: 600;
        margin-top: 10px;
      }

      .image-container {
        flex: 1;
        min-height: 0;
        background-color: #f3f4f6;
        border: 2px dashed #d1d5db;
        border-radius: 12px;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        padding: 8px;
      }

      .image-container img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }

      .btn-show {
        background-color: #10b981;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        font-size: 1.1rem;
        font-weight: bold;
        cursor: pointer;
        transition: background-color 0.2s;
        width: 100%;
        max-width: 350px;
        flex-shrink: 0;
      }

      .btn-show:hover {
        background-color: #059669;
      }

      .modal-answer {
        font-size: 1.2rem;
        color: #047857;
        font-weight: bold;
        background-color: #ecfdf5;
        padding: 10px 16px;
        border-radius: 8px;
        width: 100%;
        display: none;
        flex-shrink: 0;
      }

      .modal-answer.visible {
        display: block;
      }

      .btn-close {
        position: absolute;
        top: 12px;
        right: 16px;
        background: none;
        border: none;
        font-size: 1.8rem;
        font-weight: bold;
        color: #6b7280;
        cursor: pointer;
        line-height: 1;
        z-index: 10;
        padding: 4px;
        transition: color 0.2s;
      }

      .btn-close:hover {
        color: #ef4444;
      }

      @keyframes dealCard {
        0% {
          opacity: 0;
          transform: translateY(-100px) scale(0.5) rotate(-15deg);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1) rotate(0deg);
        }
      }

      .card-btn.animate-deal {
        animation: dealCard 0.4s ease-out forwards;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <main class="grid-container" id="board"></main>

    <dialog class="modal" id="card-modal">
      <button class="btn-close" id="modal-close-btn" aria-label="Cerrar modal">
        &times;
      </button>
      <div class="modal-content">
        <p class="modal-question" id="modal-question-text"></p>

        <div class="image-container" id="modal-image-container">
          <img id="modal-img" src="" alt="" />
        </div>

        <button class="btn-show" id="modal-show-btn">Mostrar Respuesta</button>
        <div class="modal-answer" id="modal-answer-text"></div>
      </div>
    </dialog>

    <script>
      const cardsData = [
        {
          id: 1,
          question: "¿Cuál es la idea principal de un micromundo?",

            "https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=1200&q=80",
          imgAlt: "Aprendizaje mediante tecnología",
        },
        {
          id: 2,
          question: "¿En los micromundos se aprende leyendo o haciendo?",
          answer: "Haciendo (tomando decisiones directas).",
          imgSrc:
            "https://images.unsplash.com/photo-1519389950473-47ba0277781c?auto=format&fit=crop&w=1200&q=80",
          imgAlt: "Personas aprendiendo y trabajando en equipo",
        },
        {
          id: 3,
          question:
            "¿En qué sector se utiliza el ejemplo clásico de los simuladores para explicar el aprendizaje sin riesgos?",
          answer: "Con los aviones / simuladores de aviación.",
          imgSrc:
            "https://education.okstate.edu/site-files/images/aviation-space/avi-space-minors.jpg",
          imgAlt: "Simulador de vuelo",
        },
        {
          id: 4,
          question: "¿Los micromundos son solo juegos o también enseñan?",
          answer: "Enseñan (combinan entretenimiento con aprendizaje).",
          imgSrc:
            "https://images.unsplash.com/photo-1593508512255-86ab42a8e620?auto=format&fit=crop&w=1200&q=80",
          imgAlt: "Tecnología de videojuegos y entretenimiento",
        },
        {
          id: 5,
          question:
            "Menciona uno de los 4 casos seleccionados de micromundos internacionales presentados en la exposición.",
          answer:
            "Beer Game, People Express, Oil Producers o BBC World Service.",
          imgSrc:
            "https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?auto=format&fit=crop&w=1200&q=80",
          imgAlt: "Simulación y administración empresarial",
        },
        {
          id: 6,
          question: "¿De qué país es el simulador de energía llamado ENERBIZ?",
          answer: "De Colombia.",
          imgSrc:
            "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcREMrlDN0DenV09lRqJJKhdg6UkYhNH5olAgRJAocGIeA&s=10",
          imgAlt: "Bandera de Colombia",
        },
        {
          id: 7,
          question:
            "En el simulador colombiano ENERBIZ, ¿qué servicio se compra y se vende?",
          answer: "Energía / Electricidad.",
          imgSrc:
            "https://images.unsplash.com/photo-1473341304170-971dccb5ac1e?auto=format&fit=crop&w=1200&q=80",
          imgAlt: "Infraestructura de energía",
        },
        {
          id: 8,
          question: "¿Para qué sector fue diseñado el simulador ENERBIZ?",
          answer: "Para el sector eléctrico / Mercado de Energía Mayorista.",
          imgSrc:
            "https://lirp.cdn-website.com/d2f0e919/dms3rep/multi/opt/Labour%2BPower%2BCompany%2B%28LPC%29%2Bversterkt%2Bpositie%2Bin%2BNoord-Nederland%2Bmet%2Bovername%2Bvan%2BVedaflex-1920w.jpg",
          imgAlt: "Central de generación eléctrica",
        },
        {
          id: 9,
          question:
            "¿Qué simulador colombiano permite entrenar la compra y venta de electricidad sin arriesgar dinero real?",
          answer: "ENERBIZ.",
          imgSrc:
            "https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=1200&q=80",
          imgAlt: "Gestión y análisis empresarial",
        },
        {
          id: 10,
          question:
            "¿Qué sucede dentro de un micromundo cuando tomas una mala decisión?",
          answer:
            "Observas la consecuencia (pérdidas o errores) y aprendes a corregirla en el siguiente intento.",
          imgSrc:
            "https://images.unsplash.com/photo-1552664730-d307ca884978?auto=format&fit=crop&w=1200&q=80",
          imgAlt: "Análisis y toma de decisiones",
        },
        {
          id: 11,
          question:
            "En los simuladores de empresas, ¿qué le pasa a una compañía si aumentan sus ventas pero no contrata suficiente personal?",
          answer: "Puede caer en quiebra / colapsar el servicio.",
          imgSrc:
            "https://images.unsplash.com/photo-1436491865332-7a61a109cc05?auto=format&fit=crop&w=1200&q=80",
          imgAlt: "Industria de la aviación",
        },
        {
          id: 12,
          question:
            "¿Cómo cambiaron las pantallas de los simuladores desde los años 80 hasta hoy?",
          answer:
            "Pasaron de gráficos simples en 2D con números a entornos 3D y Realidad Virtual.",
          imgSrc:
            "https://fauzanmaverick.files.wordpress.com/2010/08/ibm-pc-1980.jpg",
          imgAlt: "Computador de los años 80",
        },
        {
          id: 13,
          question:
            "¿Qué permite practicar la realidad virtual en profesiones como la medicina antes de atender a un paciente?",
          answer: "Procedimientos y técnicas médicas en un entorno simulado, sin poner en riesgo al paciente.",
          imgSrc:
            "https://storage.googleapis.com/medvarsity-ai/assimilate/banner/learning_beyond_the_scalpel%253A_the_future_of_cardiac_surgical_training.webp",
          imgAlt: "Entrenamiento de pilotos en simulador",
        },
        {
          id: 14,
          question:
            '¿Qué aparatos en la cabeza se usan hoy para sentir que estás "dentro" de un juego?',
          answer: "Gafas o visores de Realidad Virtual (VR).",
          imgSrc:
            "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRHND2tKHHGFlXmURdRCjDiCxSPPRht8hR-qEqGeAuD1A&s=10",
          imgAlt: "Experiencia de realidad virtual",
        },
        {
          id: 15,
          question:
            "Menciona una profesión de la salud que entrena con realidad virtual antes de tocar un paciente.",
          answer: "Los médicos / cirujanos.",
          imgSrc:
            "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRsDMKC2_GE2VVHs7GO5Ql2nn19k25o5KucG7hrHESckw&s=10",
          imgAlt: "Simulación quirúrgica con realidad virtual",
        },
        {
          id: 16,
          question:
            "¿Qué construyes y administras en el juego Cities: Skylines?",
          answer: "Una ciudad.",
          imgSrc:
            "https://images.unsplash.com/photo-1449824913935-59a10b8d2000?auto=format&fit=crop&w=1200&q=80",
          imgAlt: "Ciudad vista desde el aire",
        },
        {
          id: 17,
          question:
            "¿Qué videojuego de construcción de ciudades penaliza las decisiones impulsivas de tráfico o impuestos? (Se menciona en la exposición)",
          answer: "Cities: Skylines.",
          imgSrc:
            "https://elcomercio.pe/resizer/v2/ZFADTLJRNJENTFBD4MZH4MJKKA.jpg?auth=1ed33cc21bbd65138c283439b508a344b33e9f3ed84b6cb0eff8944335b0706d&height=1600&quality=75&smart=true&width=2400",
          imgAlt: "Tráfico y planificación de una ciudad",
        },
        {
          id: 18,
          question:
            "¿Cuáles son los 3 retos que enfrentan los micromundos en el futuro? (menciona al menos 2)",
          answer:
            "La sobre-simplificación, la brecha de acceso y la transferencia real.",
          imgSrc:
            "https://images.unsplash.com/photo-1535223289827-42f1e9919769?auto=format&fit=crop&w=1200&q=80",
          imgAlt: "Tecnología inmersiva del futuro",
        },
        {
          id: 19,
          question:
            "¿Qué ventaja tiene aprender mediante micromundos en lugar de limitarse a leer manuales?",
          answer:
            "Acelerar el aprendizaje práctico y evitar cometer errores costosos en la vida real.",
          imgSrc:
            "https://images.unsplash.com/photo-1521737711867-e3b97375f902?auto=format&fit=crop&w=1200&q=80",
          imgAlt: "Capacitación y trabajo en equipo",
        },
        {
          id: 20,
          question: "¿Para qué sirven los micromundos en general?",
          answer: "Para entrenar la toma de decisiones sin arriesgar nada.",
          imgSrc:
            "https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?auto=format&fit=crop&w=1200&q=80",
          imgAlt: "Planificación y toma de decisiones",
        },
      ];

      const board = document.getElementById("board");
      const modal = document.getElementById("card-modal");
      const modalQuestion = document.getElementById("modal-question-text");
      const modalImg = document.getElementById("modal-img");
      const modalAnswer = document.getElementById("modal-answer-text");
      const modalShowBtn = document.getElementById("modal-show-btn");
      const modalCloseBtn = document.getElementById("modal-close-btn");

      let currentCardButton = null;

      cardsData.forEach((card, index) => {
        const btn = document.createElement("button");
        btn.classList.add("card-btn", "animate-deal");
        btn.style.animationDelay = `${index * 0.05}s`;
        btn.textContent = card.id;

        btn.addEventListener("animationend", () => {
          btn.classList.remove("animate-deal");
          btn.style.animationDelay = "";
        });

        btn.addEventListener("click", () => openCardModal(card, btn));
        board.appendChild(btn);
      });

      function openCardModal(card, buttonElement) {
        currentCardButton = buttonElement;

        modalQuestion.textContent = card.question;
        modalAnswer.textContent = card.answer;
        modalAnswer.classList.remove("visible");

        if (card.imgSrc) {
          modalImg.src = card.imgSrc;
          modalImg.style.display = "block";
        } else {
          modalImg.src = "";
          modalImg.style.display = "none";
        }
        modalImg.alt = card.imgAlt;

        modal.showModal();
      }

      modalShowBtn.addEventListener("click", () => {
        modalAnswer.classList.add("visible");
      });

      modalCloseBtn.addEventListener("click", () => {
        modal.close();
        if (currentCardButton) {
          currentCardButton.disabled = true;
        }
      });
    </script>
  </body>
</html>
