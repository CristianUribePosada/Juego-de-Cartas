<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Juego de Cartas - Micromundos ITM</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="grid-container" id="board"></main>

    <dialog class="modal" id="card-modal">
      <button class="btn-close" id="modal-close-btn" aria-label="Cerrar modal">&times;</button>
      <div class="modal-content">
        <!-- Encabezado: Pregunta -->
        <p class="modal-question" id="modal-question-text"></p>

        <!-- Contenedor de Imagen -->
        <div class="image-container" id="modal-image-container">
          <img id="modal-img" src="" alt="" />
        </div>

        <!-- Barra de Control del Temporizador -->
        <div class="timer-container">
          <div class="timer-display" id="timer-display">30s</div>
          <button class="btn-start-timer" id="btn-start-timer">Iniciar Tiempo</button>
        </div>

        <!-- Feedback de Respuesta / Tiempo -->
        <div class="feedback-message" id="feedback-message"></div>

        <!-- Opciones Múltiples (A, B, C, D) -->
        <div class="options-grid" id="options-grid"></div>
      </div>
    </dialog>

    <script src="script.js"></script>
  </body>
</html>
